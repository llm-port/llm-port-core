# Publish llmport-cli to PyPI, with standalone executables, for a release.
#
# The CLI *is* the release a user installs: it carries the deployment files
# (llm_port_shared, packed by llm_port_cli/hatch_build.py) and `llmport deploy`
# runs the images tagged with its own version. So:
#
#   1. Set the version in llm_port_cli/pyproject.toml and
#      llm_port_cli/src/llmport/__init__.py (e.g. 0.3.0).
#   2. Tag and push:  git tag v0.3.0 && git push origin v0.3.0
#      docker-publish.yml builds the images 0.3.0 from the same tag; this
#      workflow waits until they exist before publishing the CLI, so nobody
#      can install a CLI whose images are missing.
#
# (cli-v* tags still publish the CLI alone, for a CLI-only fix; the images of
# the version it pins must already exist.)
#
# Prerequisite: a repository secret PYPI_API_TOKEN scoped to llmport-cli.

name: Release CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "cli-v*"

permissions:
  contents: write
  packages: read

env:
  CLI_DIR: llm_port_cli
  REGISTRY: ghcr.io/llm-port

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The deployment files the wheel carries come from llm_port_shared.
          sparse-checkout: |
            llm_port_cli
            llm_port_shared

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag and the package agree on the version
        id: version
        shell: bash
        working-directory: ${{ env.CLI_DIR }}
        run: |
          set -euo pipefail
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/llmport/__init__.py)
          if [ "$PYPROJECT" != "$PACKAGE" ]; then
            echo "::error::pyproject says $PYPROJECT, src/llmport/__init__.py says $PACKAGE"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/cli-v*)
              if [ "${TAG#cli-}" != "v$PYPROJECT" ]; then
                echo "::error::Tag $TAG does not match version $PYPROJECT"
                exit 1
              fi ;;
          esac
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        working-directory: ${{ env.CLI_DIR }}
        run: |
          pip install --upgrade build
          python -m build

      - name: The wheel carries the deployment files
        working-directory: ${{ env.CLI_DIR }}
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl > contents.txt
          for f in docker-compose.yaml nginx/nginx.conf initdb/01-init.sql prometheus/prometheus.yml; do
            grep -q "llmport/bundle/shared/$f" contents.txt || { echo "::error::wheel lacks $f"; exit 1; }
          done
          if grep -qE "bundle/shared/(\.env|\.bootstrap-credentials|backups/)" contents.txt; then
            echo "::error::wheel carries install state"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: ${{ env.CLI_DIR }}/dist/*

  images-exist:
    # `llmport deploy` pulls <registry>/<service>:<version>. Publishing a CLI
    # before its images exist hands users a deploy that cannot pull.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this release's images
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for attempt in $(seq 1 60); do
            missing=""
            for svc in backend api frontend; do
              docker manifest inspect "$REGISTRY/$svc:$VERSION" >/dev/null 2>&1 || missing="$missing $svc"
            done
            [ -z "$missing" ] && { echo "All images for $VERSION are published."; exit 0; }
            echo "Waiting for:$missing ($attempt/60)"
            sleep 60
          done
          echo "::error::Images for $VERSION never appeared:$missing"
          exit 1

  publish:
    # A manual run stops before this: it checks the build, publishes nothing.
    needs: [build, images-exist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install --upgrade twine
          twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LLM.Port ${{ needs.build.outputs.version }}"
          generate_release_notes: true
          body: |
            ```bash
            pipx install llmport-cli==${{ needs.build.outputs.version }}
            llmport deploy
            ```
            Runs the images `${{ env.REGISTRY }}/*:${{ needs.build.outputs.version }}`.
            Upgrading an install: install this CLI, then `llmport upgrade`.
          files: dist/*

  executables:
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: llmport-linux-amd64
            artifact: llmport-linux-amd64
          - os: windows-latest
            name: llmport-windows-amd64
            artifact: llmport-windows-amd64.exe
          - os: macos-latest
            name: llmport-macos-arm64
            artifact: llmport-macos-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build executable
        shell: bash
        run: |
          pip install --upgrade pip pyinstaller
          pip install dist/*.whl
          ENTRY=$(python -c "import llmport.cli, sys; print(llmport.cli.__file__)")
          # --collect-data: the deployment files are package data.
          pyinstaller --onefile --clean --name "${{ matrix.name }}" \
            --collect-submodules llmport --collect-data llmport "$ENTRY"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ matrix.artifact }}
