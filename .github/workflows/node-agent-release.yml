# Build and release the node agent: the binaries the install line fetches.
#
# The backend's install plan points machines at
#   https://github.com/llm-port/llm-port-core/releases/download/node-agent-v<version>/llmport-agent-<platform>
# for <platform> linux-x86_64 and linux-aarch64 (see
# llm_port_backend/web/api/install/__init__.py, RELEASE_URL and AGENT_VERSION).
# This workflow makes exactly those files.
#
# Release:
#   1. Bump the version in llm_port_node_agent/pyproject.toml and
#      llm_port_node_agent/llm_port_node_agent/__init__.py, and AGENT_VERSION in
#      the backend -- the backend is what tells machines which agent to install.
#   2. Tag and push: git tag node-agent-v0.1.12 && git push origin node-agent-v0.1.12
#
# Each binary is built by build-binary.sh in a Debian bookworm container, on a
# runner of its own architecture: built on a newer distro, the agent links a
# newer glibc and fails on older nodes (the DGX Sparks run glibc 2.39; many
# servers run older).

name: Release Node Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "node-agent-v*"

permissions:
  contents: write

env:
  AGENT_DIR: llm_port_node_agent

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag, the agent and the backend agree on the version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('$AGENT_DIR/pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$AGENT_DIR/llm_port_node_agent/__init__.py")
          BACKEND=$(sed -n 's/^AGENT_VERSION = "\(.*\)"/\1/p' llm_port_backend/llm_port_backend/web/api/install/__init__.py)
          echo "pyproject=$PYPROJECT package=$PACKAGE backend=$BACKEND"
          if [ "$PYPROJECT" != "$PACKAGE" ] || [ "$PYPROJECT" != "$BACKEND" ]; then
            echo "::error::Versions differ: pyproject $PYPROJECT, package $PACKAGE, backend AGENT_VERSION $BACKEND"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/node-agent-v* ]] && [ "${GITHUB_REF#refs/tags/node-agent-v}" != "$PYPROJECT" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $PYPROJECT"
            exit 1
          fi
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: llm_port_node_agent

      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        run: sh build-binary.sh ${{ matrix.platform }}

      - name: Smoke test
        working-directory: ${{ env.AGENT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/llmport-agent-${{ matrix.platform }}"
          chmod +x "$BIN"
          # It must start, parse its arguments and print its licence -- in the
          # oldest environment it claims to support, not only on this runner.
          docker run --rm -v "$PWD/dist:/d:ro" debian:bookworm-slim "/d/llmport-agent-${{ matrix.platform }}" license | head -5
          sha256sum "$BIN" | awk '{print $1}' > "$BIN.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: llmport-agent-${{ matrix.platform }}
          path: |
            ${{ env.AGENT_DIR }}/dist/llmport-agent-${{ matrix.platform }}
            ${{ env.AGENT_DIR }}/dist/llmport-agent-${{ matrix.platform }}.sha256
          retention-days: 30

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node-agent-v${{ needs.version.outputs.version }}
          name: "Node Agent v${{ needs.version.outputs.version }}"
          generate_release_notes: true
          body: |
            Standalone agent binaries for Linux, no Python needed. Machines normally
            get them through the install line on the LLM.Port **Machines → Add a
            machine** page, which checks the SHA-256 against the server's own copy.

            Built in Debian bookworm (glibc 2.36), so they run on that and newer.
          files: artifacts/*

  pypi:
    # Optional: only when the repository has a PyPI token. The binaries above
    # are what installs use; this must never hold them back.
    needs: [version, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: llm_port_node_agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and upload
        if: env.TWINE_PASSWORD != ''
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          pip install --upgrade build twine
          python -m build
          twine upload dist/*
