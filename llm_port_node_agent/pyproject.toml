[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmport-agent"
version = "0.1.8"
description = "Node execution agent for llm-port cluster-managed runtimes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "psutil>=5.9,<8.0",
  "websockets>=12,<16",
  # Ray SDK is packaged with the agent: RayCoreClient attaches to the local
  # cluster in-process (ray.init address="auto") and the RayRuntimeManager
  # bootstrap layer drives the *same* packaged CLI for `ray start`/`ray stop`,
  # which guarantees SDK/cluster version parity.  The `[serve]` extra provides
  # the Ray Serve Python APIs (serve.run/status/delete/shutdown) used by
  # RayServeManager.  2.58 is the LLM.Port-tested release; see
  # llm-port-dev/llm_port_ray_migration/ray_sdk_refactor.md.
  "ray[serve]==2.58.0",
  # Ray 2.58 bug: ray/serve/_private/haproxy.py imports jinja2 at import time,
  # but the `serve` extra does not declare it.  Declared explicitly so
  # `from ray import serve` works in a clean agent environment.
  "jinja2>=3.1,<4",
]

[project.scripts]
llmport-agent = "llm_port_node_agent.__main__:main"

[project.optional-dependencies]
llm = [
  "ray[serve,llm]==2.58.0",
]
hf = [
  "huggingface-hub>=0.27,<2",
]
build = [
  "pyinstaller>=6.0,<7.0",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["llm_port_node_agent"]
