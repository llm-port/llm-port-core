# llm-port runtime metrics — Prometheus scrape config.
#
# The single `llm-runtimes` job discovers targets from targets.json
# (file_sd). That file is GENERATED by the backend's monitoring
# provisioner on the shared-stack host directory (see
# llm_port_backend/services/llm/monitoring.py). It is seeded with `[]`
# and is never hand-edited.
#
# Each entry in targets.json looks like:
#   [
#     {
#       "targets": ["192.168.1.50:5001"],
#       "labels": {
#         "runtime_id": "…uuid…",
#         "runtime_name": "dgx1-moondream",
#         "provider_name": "DGX Spark 1",
#         "model_name": "moonshotai/Kimi-K2-Instruct",
#         "node_host": "192.168.1.50"
#       }
#     }
#   ]
#
# Reloading: config changes are picked up via POST http://<prom>:9090/-/reload
# (--web.enable-lifecycle) and, as a backstop, file_sd refresh_interval.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: llm-port

scrape_configs:
  - job_name: llm-runtimes
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 15s
