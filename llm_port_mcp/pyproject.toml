[project]
name = "llm_port_mcp"
version = "0.0.3"
description = "MCP Tool Registry — governed MCP broker for llm.port"
readme = "README.md"
requires-python = ">=3.11,<4"
authors = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
maintainers = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.14.2",  # >=2.14.2: clears GHSA-4xgf-cpjx-pc3j
  "yarl>=1.18.3",
  "ujson>=5.13.0",  # >=5.13.0: clears PYSEC-2026-2291/2292/2293/2294
  "prometheus-client>=0.21.1",
  "prometheus-fastapi-instrumentator>=8.1.0,<9",  # 7.0.0 capped starlette<1.0; 8.x allows starlette 1.x (clears starlette CVEs)
  "sentry-sdk>=2.19.2",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-instrumentation>=0.50b0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "loguru>=0.7.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "cryptography>=50.0.0",  # >=50.0.0: clears PYSEC-2026-35/36/3552/3553/3554
  "httpx>=0.27.0",
  "pyjwt>=2.13.0",  # >=2.13.0: clears PYSEC-2026-120/175-179
  "redis[hiredis]>=5.0.0",
  "mcp>=1.28.1,<2",  # >=1.28.1: clears latest mcp advisories; <2: mcp 2.x is a breaking API change (httpx->httpx2, mcp+mcp-types split)
  "python-multipart>=0.0.31",  # >=0.0.31: clears PYSEC-2026-3036/3037/3038/3039/3040
  # Transitive floors — conservative uv lock, force vulnerable transitives up to the fix:
  "urllib3>=2.7.0",  # >=2.7.0: clears PYSEC-2026-141/142
  "starlette>=1.3.1",  # >=1.3.1: clears starlette CVEs (requires instrumentator 8.x)
  "idna>=3.15",  # >=3.15: clears PYSEC-2026-215
  "requests>=2.33.0",  # >=2.33.0: clears PYSEC-2026-2275
  "mako>=1.3.12",  # >=1.3.12: clears PYSEC-2026-2617
  "click>=8.3.3",  # >=8.3.3: clears PYSEC-2026-2132
  "pygments>=2.20.0",  # >=2.20.0: clears PYSEC-2026-2987
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",  # >=9.0.3: clears PYSEC-2026-1845
  "ruff>=0.5.0",
  "mypy>=1.10.1",
  "pre-commit>=3.7.1",
  "black>=26.3.1",  # >=26.3.1: clears PYSEC-2026-2121
  "pytest-cov>=5",
  "anyio>=4",
  "pytest-env>=1.1.3",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["llm_port_mcp",]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
env = [
    "LLM_PORT_MCP_ENVIRONMENT=pytest",
    "LLM_PORT_MCP_DB_BASE=llm_mcp_test",
    "LLM_PORT_MCP_SENTRY_DSN=",
]

[tool.ruff]
lint.select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
lint.ignore = [
    "D105",
    "D107",
    "B008",
    "D211",
    "D212",
    "D401",
    "D104",
    "D100",
    "D202",
    "ANN102",
    "ANN101",
    "ANN401",
    "PLR0913",
    "D106",
]
exclude = [
    ".venv/"
]
lint.mccabe = { max-complexity = 10 }
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]
