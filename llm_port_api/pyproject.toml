[project]
name = "llm_port_api"
version = "0.0.3"
description = ""
readme = "README.md"
requires-python = ">=3.11,<4"
authors = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
maintainers = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "yarl>=1.18.3",
  "ujson>=5.13.0",  # >=5.13.0: clears PYSEC-2026-2291/2292/2293/2294
  "sqlalchemy[asyncio]>=2.0.44",
  "asyncpg>=0.30.0",
  "alembic>=1.14.1",
  "httpx>=0.28.1",
  "pyjwt>=2.13.0",  # >=2.13.0: clears PYSEC-2026-120/175-179
  "langfuse>=2.60.5",
  "redis[hiredis]>=5.2.1",
  "cryptography>=50.0.0",  # >=50.0.0: clears PYSEC-2026-35/36/3552/3553/3554
  "aio-pika>=9.5.4",
  "prometheus-client>=0.21.1",
  "prometheus-fastapi-instrumentator>=8.1.0,<9",  # 7.0.0 capped starlette<1.0; 8.x allows starlette 1.x (clears starlette CVEs)
  "sentry-sdk>=2.19.2",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-instrumentation>=0.50b0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-redis>=0.50b0",
  "opentelemetry-instrumentation-aio-pika>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "loguru>=0.7.3",
  "taskiq>=0.11.10",
  "taskiq-fastapi>=0.3.3",
  "taskiq-redis>=1.0.2",
  "taskiq-aio-pika>=0.4.1",
  "aiofiles>=24.1.0",
  "python-multipart>=0.0.31",  # >=0.0.31: clears PYSEC-2026-3036/3037/3038/3039/3040
  "litellm>=1.84.0,<2",  # >=1.84.0: fixes CVE-2026-35030 / CVE-2026-42208 / CVE-2026-49468 (proxy-side); 1.82.7 & 1.82.8 were malware releases
  # Transitive floors — no direct cap exists in pyproject; uv lock is conservative
  # (keeps previously locked versions), so each floor is spelled out to force the fix:
  "idna>=3.15",  # >=3.15: clears PYSEC-2026-215
  "urllib3>=2.7.0",  # >=2.7.0: clears PYSEC-2026-141/142
  "requests>=2.33.0",  # >=2.33.0: clears PYSEC-2026-2275
  "mako>=1.3.12",  # >=1.3.12: clears PYSEC-2026-2617 (alembic template runtime dep)
  "click>=8.3.3",  # >=8.3.3: clears PYSEC-2026-2132
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",  # >=9.0.3: clears PYSEC-2026-1845
  "ruff>=0.5.0",
  "mypy>=1.10.1",
  "pre-commit>=3.7.1",
  "black>=26.3.1",  # >=26.3.1: clears PYSEC-2026-2121
  "pygments>=2.20.0",  # >=2.20.0: clears PYSEC-2026-2987
  "pytest-cov>=5",
  "anyio>=4",
  "pytest-env>=1.1.3",
  "fakeredis[lua]>=2.23.3",
  "httpx>=0.28.1",
  "aiosqlite>=0.20.0",
  "taskiq[reload]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["llm_port_api",]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

# Remove this and add `types-redis`
# when the issue https://github.com/python/typeshed/issues/8242 is resolved.
[[tool.mypy.overrides]]
module = [
    'redis.asyncio'
]
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
    # starlette>=1.6 TestClient prefers the new `httpx2` client; the httpx fallback
    # is only used by tests (runtime never imports TestClient). Adopt httpx2 in a
    # dedicated change; allow it here rather than widening the runtime dev surface.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]
env = [
    "LLM_PORT_API_ENVIRONMENT=pytest",
    "LLM_PORT_API_DB_BASE=llm_port_api_test",
    "LLM_PORT_API_DB_URL_OVERRIDE=sqlite+aiosqlite:///:memory:",
    "LLM_PORT_API_SENTRY_DSN=",
    "LLM_PORT_API_JWT_SECRET=test-secret-32-bytes-minimum-value",
]

[tool.ruff]
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
lint.ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN102",  # Missing type annotation for self in method
    "ANN101",  # Missing type annotation for argument
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
    "D102",    # Missing docstring in public method
]
exclude = [
    ".venv/"
]
lint.mccabe = { max-complexity = 10 }
line-length = 110

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Use of assert detected
    "S105", # Test secrets may be hardcoded
    "D103", # Missing docstring in tests
    "E501", # Line length in tests
    "Q003", # Escaped string style in tests
    "RUF100", # Allow noqa in tests when needed
]
"llm_port_api/db/migrations/versions/*" = [
    "N999",
    "E501",
    "S608",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]


[fastapi-template.options]
project_name = "llm_port_api"
api_type = "rest"
enable_redis = "True"
enable_rmq = "True"
ci_type = "none"
enable_migrations = "None"
enable_taskiq = "True"
enable_kube = "None"
kube_name = "llm-port-api"
enable_routers = "True"
enable_kafka = "None"
enable_loguru = "True"
traefik_labels = "None"
add_dummy = "None"
orm = "none"
self_hosted_swagger = "True"
prometheus_enabled = "True"
sentry_enabled = "True"
otlp_enabled = "True"
gunicorn = "None"
add_users = "None"
cookie_auth = "None"
jwt_auth = "None"
